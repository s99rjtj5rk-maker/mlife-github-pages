<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>安装 M生活踪迹</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.card{background:#1e293b;border-radius:20px;padding:30px;max-width:400px;width:100%;text-align:center;margin-top:30px;border:1px solid #334155}
.icon{width:80px;height:80px;border-radius:20px;margin-bottom:16px}
h1{font-size:24px;margin-bottom:4px}
.sub{color:#94a3b8;font-size:14px;margin-bottom:20px}
.badge{display:inline-block;background:#065f46;color:#6ee7b7;border-radius:6px;padding:3px 10px;font-size:11px;margin-bottom:16px}
.steps{text-align:left;background:#0f172a;border-radius:14px;padding:20px;margin:20px 0}
.step{display:flex;align-items:flex-start;margin-bottom:14px}
.step:last-child{margin-bottom:0}
.step-num{background:#3b82f6;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex-shrink:0;margin-right:10px}
.step-text{font-size:14px;line-height:1.5}
.btn{display:inline-block;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;text-decoration:none;padding:15px 48px;border-radius:14px;font-size:17px;font-weight:600;margin:12px 0}
.btn:active{transform:scale(0.97)}
.warn{background:#422006;color:#fbbf24;border-radius:10px;padding:12px;font-size:13px;margin-top:16px;text-align:left;border:1px solid #78350f}
.note{font-size:12px;color:#64748b;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
    <img class="icon" src="apple-touch-icon.png" alt="M生活踪迹">
    <h1>M生活踪迹</h1>
    <p class="sub">📱 一键添加到 iPhone 主屏幕</p>
    <div class="badge">🟢 GitHub Pages 永久托管</div>
    
    <div class="steps">
        <div class="step"><div class="step-num">1</div><div class="step-text">点击下方按钮下载配置文件</div></div>
        <div class="step"><div class="step-num">2</div><div class="step-text">前往 <b>设置</b> → <b>已下载描述文件</b></div></div>
        <div class="step"><div class="step-num">3</div><div class="step-text">点击 <b>安装</b> → 输入密码 → 🎉</div></div>
    </div>
    
    <a class="btn" href="install.mobileconfig">📲 安装到 iPhone</a>
    
    <div class="warn">⚠️ 必须用 <b>Safari</b> 打开 · Chrome/微信无法安装</div>
    <p class="note">桌面出现 🦫 图标即成功<br>可在设置 → 通用 → VPN与设备管理 中删除</p>
</div>
</body>
</html>
